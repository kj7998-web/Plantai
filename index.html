<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plantai Folder Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    .folder-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border: 1px solid #ddd; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Folders</h1>
  <div class="row">
    <input id="folderName" type="text" placeholder="Folder name" />
    <button id="createBtn" onclick="createFolder()">Create</button>
  </div>
  <div id="list"></div>
  <script>
    const KEY = 'plantai_folders_v1';
    function getLocal() {
      const raw = localStorage.getItem(KEY);
      if (!raw) {
        const init = [{ id: '1', name: 'Existing Plants' }];
        localStorage.setItem(KEY, JSON.stringify(init));
        return init;
      }
      return JSON.parse(raw);
    }
    function setLocal(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

    async function loadFolders() {
      let folders;
      try {
        const res = await fetch('/api/folders');
        if (!res.ok) throw new Error();
        const data = await res.json();
        folders = data.folders;
      } catch {
        folders = getLocal();
      }
      const list = document.getElementById('list');
      list.innerHTML = '';
      folders.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'folder-item';
        div.setAttribute('data-index', idx);
        div.innerHTML = `
          <span class="name">${f.name}</span>
          <div>
            <input class="rename-input" id="rename-${idx}" value="${f.name}" />
            <button class="rename" onclick="renameFolder('${f.id}', ${idx})">Rename</button>
            <button class="delete" onclick="deleteFolder('${f.id}')">Delete</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function createFolder() {
      const input = document.getElementById('folderName');
      const name = input.value.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/folders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error();
      } catch {
        const items = getLocal();
        items.push({ id: String(Date.now()), name });
        setLocal(items);
      }
      input.value = '';
      await loadFolders();
    }

    async function renameFolder(id, idx) {
      const name = document.getElementById('rename-' + idx).value.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/folders/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error();
      } catch {
        const items = getLocal().map(f => f.id === id ? { ...f, name } : f);
        setLocal(items);
      }
      await loadFolders();
    }

    async function deleteFolder(id) {
      try {
        const res = await fetch('/api/folders/' + id, { method: 'DELETE' });
        if (!res.ok) throw new Error();
      } catch {
        setLocal(getLocal().filter(f => f.id !== id));
      }
      await loadFolders();
    }

    loadFolders();
  </script>
</body>
</html>
